services:
  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_USER: webtoon
      POSTGRES_PASSWORD: webtoon_dev
      POSTGRES_DB: webtoon

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webtoon -d webtoon"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
