name: CI

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: webtoon
          POSTGRES_PASSWORD: webtoon_dev
          POSTGRES_DB: webtoon_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U webtoon -d webtoon_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://webtoon:webtoon_dev@localhost:5432/webtoon_test?schema=public
      TEST_DATABASE_URL: postgresql://webtoon:webtoon_dev@localhost:5432/webtoon_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:integration
